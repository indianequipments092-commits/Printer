name: Build Advanced Billing APK

on:
  workflow_dispatch:
  push:
    branches: [ billing-app ]
    paths:
      - 'BillingApp/**'
      - '.github/workflows/build-billing-app.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build debug APK
        working-directory: BillingApp
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Advanced-Billing-debug-apk
          path: BillingApp/app/build/outputs/apk/debug/app-debug.apk
