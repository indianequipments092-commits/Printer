name: PrintBridge Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Expo dependency validation
        run: npx expo install --check

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Verify EAS configuration
        run: |
          test -f eas.json
          node -e "const p=require('./eas.json'); if(!p.build?.preview?.android || p.build.preview.android.buildType !== 'apk') process.exit(1)"

      - name: Build Android APK with Expo/EAS
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
