name: Build USB Scanner APK

on:
  push:
    paths:
      - 'ScannerApp/**'
      - '.github/workflows/build-scanner.yml'
      - '.github/scripts/**'
      - '.github/assets/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ScannerApp
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Apply USB Scanner UI and fresh integrated Printex
        run: |
          cd ..
          python3 .github/scripts/upgrade_ui.py
          python3 .github/scripts/fix_printex_controls.py
          python3 .github/scripts/repair_printex_build.py
          python3 .github/scripts/finalize_printex.py
          python3 .github/scripts/apply_icons.py
          python3 .github/scripts/verify_printex.py
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify APK output
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: usb-scanner-printex-debug-apk
          path: ScannerApp/app/build/outputs/apk/debug/app-debug.apk
