name: Build USB Scanner APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ScannerApp
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Apply USB Scanner UI and Step 4
        run: |
          cd ..
          python3 .github/scripts/upgrade_ui.py
          python3 .github/scripts/step2_printer_selector.py
          python3 .github/scripts/step2_compile_fix.py
          python3 .github/scripts/step3_ui_completion.py
          python3 .github/scripts/step3_functionality.py
          python3 .github/scripts/step4_printer_workflow.py
          python3 .github/scripts/step4_settings_library.py
          python3 .github/scripts/apply_icons.py
      - name: Verify generated Step 4 source
        run: |
          cd ..
          python3 .github/scripts/verify_step4.py
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify Step 3 source
        run: |
          cd ..
          python3 .github/scripts/verify_step3.py
      - name: Verify Step 4 source again
        run: |
          cd ..
          python3 .github/scripts/verify_step4.py
      - name: Verify APK output
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: usb-scanner-debug-apk
          path: ScannerApp/app/build/outputs/apk/debug/app-debug.apk
