name: Build USB Scanner APK

on:
  push:
    paths:
      - 'ScannerApp/**'
      - '.github/workflows/build-scanner.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ScannerApp
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      # PDF Reader feature has been completely removed; no PDF Reader patch script is run.
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: usb-scanner-debug-apk
          path: ScannerApp/app/build/outputs/apk/debug/app-debug.apk
