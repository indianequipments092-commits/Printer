name: Build USB Scanner APK

on:
  push:
    paths:
      - 'ScannerApp/**'
      - '.github/workflows/build-scanner.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ScannerApp
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply PDF Reader and UI fixes
        working-directory: .
        run: |
          python3 .github/scripts/apply_pdf_reader.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ScannerApp/app/src/main/java/com/indianequipments/usbscanner/MainActivity.kt \
                  ScannerApp/app/src/main/java/com/indianequipments/usbscanner/PdfReaderActivity.kt \
                  ScannerApp/app/src/main/AndroidManifest.xml \
                  ScannerApp/app/src/main/res/drawable/ic_launcher.xml
          if git diff --cached --quiet; then
            echo "PDF Reader and UI fixes already applied"
          else
            git commit -m "Fix PDF Reader interactions and add app icon"
            git push origin HEAD:main
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: usb-scanner-debug-apk
          path: ScannerApp/app/build/outputs/apk/debug/app-debug.apk
